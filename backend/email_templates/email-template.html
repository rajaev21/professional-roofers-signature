<!DOCTYPE html>
<html
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:o="urn:schemas-microsoft-com:office:office"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <title></title>

    <style>
      table,
      td,
      div,
      h1,
      p {
        font-family: Helvetica, Arial, "Sans Serif";
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0">
    <table
      role="presentation"
      style="
        width: 100%;
        border-collapse: collapse;
        border: 0;
        border-spacing: 0;
        background: #ffffff;
      "
    >
      <tr>
        <td align="center" style="padding: 0">
          <table
            role="presentation"
            style="
              width: 700px;
              border-collapse: collapse;
              border: 1px solid #cccccc;
              border-spacing: 0;
              text-align: left;
            "
          >
            <tr>
              <td align="center" style="background: #f5f5f5">
                <img
                  src="https://app.professionalroofersnearme.co/sig/images/prnm-logo.png"
                  style="width: 200px; height: auto; display: block"
                  alt="Professional Roofers"
                />
              </td>
            </tr>
            <tr>
              <td style="padding: 36px 30px 36px 30px">
                <table
                  role="presentation"
                  style="
                    width: 100%;
                    border-collapse: collapse;
                    border: 0;
                    border-spacing: 0;
                    background: #057fd7;
                  "
                >
                  <tr>
                    <td align="center" style="padding: 10px">
                      <img
                        src="https://app.primesealsignatures.com/images/contract-icon.png"
                        style="width: 75px; height: 75px; display: block"
                      />
                    </td>
                  </tr>
                  <tr>
                    <td
                      style="
                        padding-top: 20px;
                        font-size: 16px;
                        text-align: center;
                        border-style: none;
                        color: #fff;
                      "
                    >
                      {{sender_name}} has sent you a document to review and
                      sign.
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding: 20px">
                      <a
                        href="{{link}}"
                        style="
                          display: inline-block;
                          font-weight: 400;
                          line-height: 1.53;
                          color: #fff;
                          background-color: #3b9e62;
                          border-color: #3b9e62;
                          text-align: center;
                          vertical-align: middle;
                          cursor: pointer;
                          user-select: none;
                          padding: 0.4375rem 1.25rem;
                          font-size: 0.9375rem;
                          border-radius: 0.375rem;
                          text-decoration: none;
                        "
                      >
                        Review Documents
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 30px; padding-top: 0px">
                <table
                  role="presentation"
                  style="
                    width: 100%;
                    border-collapse: collapse;
                    border: 0;
                    border-spacing: 0;
                    font-size: 14px;
                    font-family: Arial, sans-serif;
                  "
                >
                  <tr>
                    <td style="padding: 0; width: 50%" align="left">
                      <p
                        style="
                          margin: 0;
                          line-height: 16px;
                          font-family: Arial, sans-serif;
                        "
                      >
                        Professional Roofers Signatures
                        <br />mail@app.primesealsignatures.com
                        <br />
                      </p>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 0; width: 100%" align="left">
                      {{email_message}}
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 0; width: 50%" align="left">
                      <p
                        style="
                          color: rgb(174, 174, 174) !important;
                          font-size: 13px;
                          font-family: Helvetica, Arial, 'Sans Serif';
                          margin-top: 20px;
                          margin-bottom: 1em;
                          line-height: 18px;
                        "
                        data-ogsc="rgb(102, 102, 102)"
                      >
                        <strong aria-level="3" role="heading">
                          Do Not Share This Email
                        </strong>
                        <br />
                        This email contains a secure link to Professional Roofers.
                      </p>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 0; width: 100%" align="left">
                      <p
                        style="
                          color: #aeaeae;
                          font-size: 12px;
                          font-family: Helvetica, Arial, 'Sans Serif';
                          margin-top: 10px;
                          margin-bottom: 0;
                          line-height: 16px;
                        "
                      >
                        This is a system generated email, do not reply.
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
